<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOPUPERS · Admin</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#192945;background:#f5f8fd}*{box-sizing:border-box}body{margin:0}header{background:white;border-bottom:1px solid #e4eaf4;padding:19px max(20px,calc((100vw - 1300px)/2));display:flex;justify-content:space-between;align-items:center;gap:10px}h1{margin:0;font-size:23px}main{max-width:1320px;margin:30px auto;padding:0 20px}.brand{font-weight:900;color:#215eea}button{cursor:pointer;border:0;border-radius:9px;padding:11px 16px;background:#2463eb;color:white;font-weight:700}button.secondary{background:#e9efff;color:#2353ba}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0}.stat,.panel{background:white;border:1px solid #e4eaf4;border-radius:16px;padding:22px;box-shadow:0 8px 24px #11224a08}.stat b{font-size:30px;display:block;margin-top:9px}.muted{color:#75849b;font-size:13px}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:950px}th,td{text-align:left;border-bottom:1px solid #e9edf4;padding:14px 10px;font-size:13px;vertical-align:top}th{color:#677791}input,select,textarea{width:100%;border:1px solid #dce5f1;border-radius:8px;padding:9px;background:white;font:inherit}textarea{min-height:60px;resize:vertical}label{font-size:12px;color:#64748b}dialog{border:0;border-radius:17px;width:min(580px,94vw);padding:24px;box-shadow:0 20px 100px #11254c44}dialog::backdrop{background:#091c3b99}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.full{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}@media(max-width:650px){.stats{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}}
</style></head><body><header><div><span class="brand">TOPUPERS</span> / Admin dashboard</div><div><a href="/">Storefront</a> <button class="secondary" id="logout">Sign out</button></div></header><main><h1>Order management</h1><p class="muted">Review customer orders, verify payments and manage deliveries.</p><section class="stats"><div class="stat">Customers<b id="users">—</b></div><div class="stat">Orders<b id="count">—</b></div><div class="stat">Verified revenue<b id="revenue">—</b></div></section><div class="panel"><div style="display:flex;gap:15px;align-items:center;justify-content:space-between;flex-wrap:wrap"><h2>All orders</h2><button id="refresh">Refresh</button></div><div class="tablewrap"><table><thead><tr><th>Order / Date</th><th>Customer</th><th>Game / Package</th><th>Recipient / Server</th><th>Payment</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><dialog id="editor"><h2>Edit order</h2><p id="detail" class="muted"></p><form id="editForm"><div class="formgrid"><div><label>Delivery status</label><select id="status"><option>Pending Payment</option><option>Payment Submitted</option><option>Processing</option><option>Delivered</option><option>Cancelled</option></select></div><div><label>Payment verification</label><select id="paymentStatus"><option>Unpaid</option><option>Submitted</option><option>Verified</option><option>Rejected</option></select></div><div class="full"><label>Delivery note / tracking information</label><textarea id="note"></textarea></div></div><div class="actions"><button type="button" class="secondary" id="cancel">Cancel</button><button type="submit">Save changes</button></div></form></dialog><script>
const $=id=>document.getElementById(id);let orders=[],selected=null;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(url,method='GET',data){let r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});let j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}async function load(){try{let d=await api('/api/admin/orders');orders=d.orders;$('users').textContent=d.users;$('count').textContent=d.total_orders;$('revenue').textContent='৳ '+d.revenue.toLocaleString();$('rows').innerHTML=orders.map(o=>`<tr><td><b>${esc(o.id)}</b><div class="muted">${esc(new Date(o.created_at).toLocaleString())}</div></td><td>${esc(o.customer)}<div class="muted">${esc(o.email)}</div></td><td>${esc(o.game)}<div class="muted">${esc(o.quantity)} ${esc(o.unit)} · ৳${esc(o.price)}</div></td><td>${esc(o.recipient)}<div class="muted">${esc(o.server)}</div></td><td>${esc(o.payment)}<div class="muted">TRX: ${esc(o.transaction_id||'Not submitted')}</div><b>${esc(o.payment_status)}</b></td><td>${esc(o.status)}</td><td><button data-edit="${esc(o.id)}">Manage</button></td></tr>`).join('')||'<tr><td colspan="7">No orders yet</td></tr>'}catch(e){alert(e.message)}}document.addEventListener('click',e=>{const b=e.target.closest('[data-edit]');if(!b)return;selected=orders.find(o=>o.id===b.dataset.edit);$('detail').textContent=selected.id+' · '+selected.customer+' · '+selected.game;$('status').value=selected.status;$('paymentStatus').value=selected.payment_status;$('note').value=selected.delivery_note;$('editor').showModal()});$('cancel').onclick=()=>$('editor').close();$('refresh').onclick=load;$('logout').onclick=async()=>{await api('/api/logout','POST');location.href='/'};$('editForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/orders/'+selected.id,'PATCH',{status:$('status').value,payment_status:$('paymentStatus').value,delivery_note:$('note').value});$('editor').close();load()}catch(err){alert(err.message)}};load();
</script></body></html>
